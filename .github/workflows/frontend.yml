# 前端独立 CI：只编译/检查前端，不碰 Rust 编译与 rust-cache。
#
# 触发：改 frontend/** 或本文件时；也可手动 workflow_dispatch。
# 产物：frontend/dist（frontend-dist-<sha>），可下载后替换人类测试目录的 assets/web。

name: Frontend

# 只有明确标记 [frontend] 的提交才构建前端；也可手动 workflow_dispatch。
# 这样普通提交不会同时触发 CI 与 Frontend。
on:
  push:
    branches:
      - master
      - 'custom/**'
  workflow_dispatch:

jobs:
  build:
    # 无 [frontend] 标记的 push 直接跳过（不占 runner）
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[frontend]') }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Lint frontend
        shell: pwsh
        run: pnpm --dir frontend lint

      - name: Build frontend (tsc -b + vite build)
        shell: pwsh
        run: pnpm --dir frontend build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          # vite.config.ts 的 build.outDir 是 ../assets/web（相对 frontend）
          path: assets/web
          if-no-files-found: error
          retention-days: 14
