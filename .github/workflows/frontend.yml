# 前端独立 CI：只编译/检查前端，不碰 Rust 编译与 rust-cache。
#
# 触发：前端文件（frontend/**）变更自动构建；也可在 Actions 手动 workflow_dispatch。
# 不匹配 paths 的提交不会创建 run（避免空任务 CI）。
# 产物：assets/web（frontend-dist-<sha>），可下载后替换人类测试目录的 assets/web。

name: Frontend

on:
  push:
    branches:
      - master
      - 'custom/**'
    # 只有前端文件变更才触发（不匹配的提交不会创建空 run）
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Lint frontend
        shell: pwsh
        run: pnpm --dir frontend lint

      - name: Build frontend (tsc -b + vite build)
        shell: pwsh
        run: pnpm --dir frontend build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          # vite.config.ts 的 build.outDir 是 ../assets/web（相对 frontend）
          path: assets/web
          if-no-files-found: error
          retention-days: 14
