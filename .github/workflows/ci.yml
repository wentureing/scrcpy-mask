name: CI

on:
  push:
    branches:
      - 'custom/**'
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: '同时构建并保存 Windows 产物（zip）'
        required: false
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  ANDROID_PLATFORM_TOOLS_VERSION: '37.0.0'

jobs:
  # 快速校验：只做"编译能过"这一档，约 10 分钟出结论
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      # 纯文本断言，秒级，放最前以便快速失败（不必等 FFmpeg 构建）
      - name: Structural assertions (i18n / ratchet)
        shell: pwsh
        run: ./tools/assertions.ps1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Lint frontend
        shell: pwsh
        run: pnpm --dir frontend lint

      - name: Build frontend
        shell: pwsh
        run: pnpm --dir frontend build

      - name: Set up msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up msys
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          cache: true
          install: >-
            make
            diffutils
            gawk
            yasm
            pkg-config
          path-type: inherit

      # 与 release.yml 共用同一 key，两个 workflow 可互相命中
      - name: Cache FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-7.1.2/ffmpeg-windows-x64
          key: ffmpeg-windows-x64-7.1.2-v0.6

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: ./scripts/build-ffmpeg.sh

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: Cargo check
        shell: pwsh
        run: ./scripts/check-windows.ps1

  # 打包并保存产物；不重复跑全量单测，只跑代表性路径（release 复用编译产物）
  package:
    needs: check
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.package) }}
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Set up msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up msys
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          cache: true
          install: >-
            make
            diffutils
            gawk
            yasm
            pkg-config
          path-type: inherit

      - name: Cache FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-7.1.2/ffmpeg-windows-x64
          key: ffmpeg-windows-x64-7.1.2-v0.6

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: ./scripts/build-ffmpeg.sh

      # 内置 adb 来源；下载一次后缓存，避免每次重复拉 10+MB
      - name: Cache Android platform tools
        id: android-platform-tools-cache
        uses: actions/cache@v4
        with:
          path: android-platform-tools/windows/platform-tools
          key: android-platform-tools-windows-x64-${{ env.ANDROID_PLATFORM_TOOLS_VERSION }}

      - name: Install Android platform tools
        if: steps.android-platform-tools-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path android-platform-tools/windows | Out-Null
          Invoke-WebRequest `
            -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" `
            -OutFile "$env:RUNNER_TEMP\platform-tools.zip"
          Expand-Archive "$env:RUNNER_TEMP\platform-tools.zip" -DestinationPath android-platform-tools/windows -Force

      - name: Add Android platform tools to PATH
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\android-platform-tools\windows\platform-tools" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      # 先做一次 release 编译，后面 --release 测试可复用依赖产物（省 20+ 分钟）
      - name: Cargo build (release, warm up for tests)
        shell: pwsh
        run: |
          . ./scripts/ffmpeg-env.ps1
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 只跑代表性路径：触点路由 / UHID 触控（核心输入链路），不跑全量
      - name: Representative unit tests
        shell: pwsh
        run: |
          . ./scripts/ffmpeg-env.ps1
          cargo test --release --lib --locked -- scrcpy::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build package
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Show artifact size
        shell: pwsh
        run: |
          $zip = "target/release/scrcpy-mask-windows-x64.zip"
          if (-not (Test-Path $zip)) { throw "打包产物不存在: $zip" }
          $size = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          "产物: $zip ($size MB)"
          @"
          ### 打包产物
          - 文件: ``scrcpy-mask-windows-x64.zip``
          - 大小: $size MB
          - 提交: ``${{ github.sha }}``
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-mask-windows-x64-${{ github.sha }}
          path: target/release/scrcpy-mask-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
