name: CI

# 推送到分支即触发（远程提交就执行 CI）；也可在 Actions 页面手动 Run。
on:
  push:
    branches:
      - 'custom/**'
  workflow_dispatch:
    inputs:
      package:
        description: '构建并保存 Windows 产物（zip, artifact 14 天）'
        required: false
        default: false
        type: boolean

# 关键：不打断正在跑的 CI（cancel-in-progress: false）。
# 同一分支同时最多 1 个运行 + 1 个排队；更早的排队项由 GitHub 自动丢弃。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  # 这只是缓存"世代标签"，不是真实版本号：下载 URL 用的是 platform-tools-latest。
  # 含义：缓存命中后就不会再更新 adb，直到手动改这个值。
  # 建议每季度改一次（如 2026Q1）迫使重新拉取 latest，避免打进过旧的 adb。
  # 注意：不要写成 platform-tools_r<版本>-windows.zip 的固定 URL——实测 37.0.0 该路径返回 404。
  ANDROID_PLATFORM_TOOLS_VERSION: '37.0.0'

jobs:
  # 节流闸门：当前 run（含自己）已超过 3 个在跑/排队时，本次直接跳过，避免堆积。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check concurrent CI runs (max 3)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?per_page=30" \
            --jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued")] | length')
          echo "当前进行中/排队 CI 数量（含本次）: $count"
          if [ "$count" -gt 3 ]; then
            echo "超过 3 个，本次跳过"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      # 纯文本断言，秒级，放最前以便快速失败
      - name: Structural assertions (i18n / ratchet)
        shell: pwsh
        run: ./tools/assertions.ps1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Lint frontend
        shell: pwsh
        run: pnpm --dir frontend lint

      # tsc -b 覆盖类型错误；vite build 顺带产出 assets/web（11 秒，保留）
      - name: Typecheck + build frontend
        shell: pwsh
        run: pnpm --dir frontend build

      - name: Set up msvc
        uses: ilammy/msvc-dev-cmd@v1

      # 先查缓存：命中就不用装 MSYS2（既省时间，也避免 setup-msys2 下载 504 拖垮整个 job）
      - name: Cache FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-7.1.2/ffmpeg-windows-x64
          # key 跟随构建脚本内容：改了 build-ffmpeg.sh 就自动重建，
          # 不再依赖手工 bump "v0.x"（漏 bump 会拿到与源码不符的旧静态库）。
          # 不要加 restore-keys：脚本变了就该重建。
          key: ffmpeg-windows-x64-7.1.2-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Set up msys
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          update: false
          msystem: MINGW64
          cache: true
          install: >-
            make
            diffutils
            gawk
            yasm
            pkg-config
          path-type: inherit

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: ./scripts/build-ffmpeg.sh

      # 用 shared-key 而非 key：rust-cache 的 key 默认含 job id，
      # shared-key 可以在 job 名不同的 workflow 之间共用同一份缓存
      # （cache-warm.yml 跑在默认分支 master，其缓存在 GitHub 规则下对所有分支可见）。
      # 注意：改这里必须同步改 cache-warm.yml，否则两边 key 不一致，预热白做。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64-check
          # 不让环境变量参与 cache key，避免改 CI env 就让缓存整体失效
          env-vars: ""
          # 默认 false：编译失败时也保存已编好的依赖。
          # check 最常见的失败就是 Rust 编译错误，不设这个每次都要从零重编 500 个 crate。
          cache-on-failure: true
          # actions/cache 的同一个 key 不可覆盖，多分支同时"写"没有意义：
          # 只让开发分支写，其他 custom/* 分支纯读。
          # 换主力开发分支时记得改这里。
          save-if: ${{ github.ref == 'refs/heads/custom/improvements' }}

      # 只做 cargo check：能覆盖语法/类型/借用错误，不做 codegen 与链接
      - name: Cargo check
        shell: pwsh
        run: ./scripts/check-windows.ps1

  # 按需出包：
  #   1) Actions 页面手动 Run 并勾选 package；
  #   2) 或者 commit message 里带 [package]（这样"明确要求出包"时无需 token 也能直接跑）。
  package:
    needs: [gate, check]
    if: ${{ needs.gate.outputs.proceed == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.package) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))) }}
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Set up msvc
        uses: ilammy/msvc-dev-cmd@v1

      # 先查缓存：命中就不用装 MSYS2（避免 setup-msys2 下载 504 拖垮打包）
      - name: Cache FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-7.1.2/ffmpeg-windows-x64
          # key 跟随构建脚本内容：改了 build-ffmpeg.sh 就自动重建，
          # 不再依赖手工 bump "v0.x"（漏 bump 会拿到与源码不符的旧静态库）。
          # 不要加 restore-keys：脚本变了就该重建。
          key: ffmpeg-windows-x64-7.1.2-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Set up msys
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          update: false
          msystem: MINGW64
          cache: true
          install: >-
            make
            diffutils
            gawk
            yasm
            pkg-config
          path-type: inherit

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: ./scripts/build-ffmpeg.sh

      - name: Cache Android platform tools
        id: android-platform-tools-cache
        uses: actions/cache@v4
        with:
          path: android-platform-tools/windows/platform-tools
          key: android-platform-tools-windows-x64-${{ env.ANDROID_PLATFORM_TOOLS_VERSION }}

      - name: Install Android platform tools
        if: steps.android-platform-tools-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path android-platform-tools/windows | Out-Null
          Invoke-WebRequest `
            -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" `
            -OutFile "$env:RUNNER_TEMP\platform-tools.zip"
          Expand-Archive "$env:RUNNER_TEMP\platform-tools.zip" -DestinationPath android-platform-tools/windows -Force

      - name: Add Android platform tools to PATH
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\android-platform-tools\windows\platform-tools" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # 与 check 分开：check 是 dev profile、这里是 release，target 内容不同，不能混用。
          shared-key: windows-x64-package
          # job id 默认会进 cache key（实测 key = v0-rust-<shared-key>-<job>-<os>-<rustc>-<env>）。
          # 关掉后本 job 与 release.yml 的 windows job、cache-warm.yml 的 package-warm job
          # 才能共用同一份 release 缓存。
          add-job-id-key: false
          env-vars: ""
          # 即使构建失败也保存已编译的依赖，下次（修好问题后）能省一大半时间
          cache-on-failure: true

      # 只跑代表性路径：触点路由 / UHID 触控（复用 release 编译产物）
      - name: Cargo build (release, warm up for tests)
        shell: pwsh
        run: |
          . ./scripts/ffmpeg-env.ps1
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Representative unit tests
        shell: pwsh
        run: |
          . ./scripts/ffmpeg-env.ps1
          cargo test --release --lib --locked -- scrcpy::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build package
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Show artifact size
        shell: pwsh
        run: |
          $zip = "target/release/scrcpy-mask-windows-x64.zip"
          if (-not (Test-Path $zip)) { throw "打包产物不存在: $zip" }
          $size = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          "产物: $zip ($size MB)"
          @"
          ### 打包产物
          - 文件: ``scrcpy-mask-windows-x64.zip``
          - 大小: $size MB
          - 提交: ``${{ github.sha }}``
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-mask-windows-x64-${{ github.sha }}
          path: target/release/scrcpy-mask-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

