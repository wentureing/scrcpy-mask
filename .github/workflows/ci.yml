name: CI

# 缩减版：日常 push 只做"能否明显发现错误"的校验（断言 / lint / 类型 / cargo check）。
# 产物构建改为按需（workflow_dispatch 且勾选 package），不再占用每次 push。
on:
  push:
    branches:
      - 'custom/**'
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: '构建并保存 Windows 产物（zip, artifact 14 天）'
        required: false
        default: false
        type: boolean

# 关键：不打断正在跑的 CI（cancel-in-progress: false）。
# 同一分支同时最多 1 个运行 + 1 个排队；更早的排队项由 GitHub 自动丢弃。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  # sccache 与增量编译不兼容；同时减少 target 体积
  CARGO_INCREMENTAL: '0'
  ANDROID_PLATFORM_TOOLS_VERSION: '37.0.0'

jobs:
  # 节流闸门：当前 run（含自己）已超过 3 个在跑/排队时，本次直接跳过，避免堆积。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check concurrent CI runs (max 3)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?per_page=30" \
            --jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued")] | length')
          echo "当前进行中/排队 CI 数量（含本次）: $count"
          if [ "$count" -gt 3 ]; then
            echo "超过 3 个，本次跳过"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      # 纯文本断言，秒级，放最前以便快速失败
      - name: Structural assertions (i18n / ratchet)
        shell: pwsh
        run: ./tools/assertions.ps1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Lint frontend
        shell: pwsh
        run: pnpm --dir frontend lint

      # tsc -b 覆盖类型错误；vite build 顺带产出 assets/web（11 秒，保留）
      - name: Typecheck + build frontend
        shell: pwsh
        run: pnpm --dir frontend build

      - name: Set up msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up msys
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          cache: true
          install: >-
            make
            diffutils
            gawk
            yasm
            pkg-config
          path-type: inherit

      # 与 release.yml 共用同一 key，两个 workflow 可互相命中
      - name: Cache FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-7.1.2/ffmpeg-windows-x64
          key: ffmpeg-windows-x64-7.1.2-v0.6

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: ./scripts/build-ffmpeg.sh

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64-check

      # 只做 cargo check：能覆盖语法/类型/借用错误，不做 codegen 与链接
      - name: Cargo check
        shell: pwsh
        run: ./scripts/check-windows.ps1

  # 按需出包：仅手动触发且勾选 package 时运行
  package:
    needs: [gate, check]
    if: ${{ needs.gate.outputs.proceed == 'true' && github.event_name == 'workflow_dispatch' && inputs.package }}
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Set up msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up msys
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          cache: true
          install: >-
            make
            diffutils
            gawk
            yasm
            pkg-config
          path-type: inherit

      - name: Cache FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-7.1.2/ffmpeg-windows-x64
          key: ffmpeg-windows-x64-7.1.2-v0.6

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: ./scripts/build-ffmpeg.sh

      - name: Cache Android platform tools
        id: android-platform-tools-cache
        uses: actions/cache@v4
        with:
          path: android-platform-tools/windows/platform-tools
          key: android-platform-tools-windows-x64-${{ env.ANDROID_PLATFORM_TOOLS_VERSION }}

      - name: Install Android platform tools
        if: steps.android-platform-tools-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path android-platform-tools/windows | Out-Null
          Invoke-WebRequest `
            -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" `
            -OutFile "$env:RUNNER_TEMP\platform-tools.zip"
          Expand-Archive "$env:RUNNER_TEMP\platform-tools.zip" -DestinationPath android-platform-tools/windows -Force

      - name: Add Android platform tools to PATH
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\android-platform-tools\windows\platform-tools" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64-package

      # sccache：缓存编译单元（对 release + LTO 也有效）。
      # 第一次仍要全量编译，之后只重编改动过的 crate，通常 5–15 分钟。
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        shell: pwsh
        run: |
          "RUSTC_WRAPPER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SCCACHE_GHA_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 只跑代表性路径：触点路由 / UHID 触控（复用 release 编译产物）
      - name: Cargo build (release, warm up for tests)
        shell: pwsh
        run: |
          . ./scripts/ffmpeg-env.ps1
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Representative unit tests
        shell: pwsh
        run: |
          . ./scripts/ffmpeg-env.ps1
          cargo test --release --lib --locked -- scrcpy::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build package
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Show artifact size
        shell: pwsh
        run: |
          $zip = "target/release/scrcpy-mask-windows-x64.zip"
          if (-not (Test-Path $zip)) { throw "打包产物不存在: $zip" }
          $size = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          "产物: $zip ($size MB)"
          @"
          ### 打包产物
          - 文件: ``scrcpy-mask-windows-x64.zip``
          - 大小: $size MB
          - 提交: ``${{ github.sha }}``
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-mask-windows-x64-${{ github.sha }}
          path: target/release/scrcpy-mask-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Show sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats
